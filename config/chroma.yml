collection_name: agent
embedding_model_name: text-embedding-v4
persist_directory: rag/chroma_db
k: 3
data_path: data
md5_hex_store: md5.text
allow_knowledge_file_type: ["txt","pdf","docx"]


chunk_size: 500
chunk_overlap: 20
separators:  ["\n","\n\n",".","!","?","！","？"]

hybrid:
  enabled: true
  candidate_k: 20
  bm25_candidate_k: 10
  rrf_k: 60
  vector_weight: 1.0
  bm25_weight: 0.3
  # 同一来源最多取 1 个 chunk，避免一个文件占满上下文；
  # 如果答案依赖同文档多个片段，可调到 2 并在评测集上验证。
  max_per_source: 1
  # 实测正常用例 0.403~0.75，负样本 0.326；先取 0.35，后续用评测调。
  min_vector_score: 0.35
