name: agent-eval-nightly

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "评测条数；30 表示全量并做指标回归检查"
        required: false
        default: "5"
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: agent-eval-nightly
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check API key
        id: key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -n "$DASHSCOPE_API_KEY" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent eval with judge
        if: steps.key.outputs.present == 'yes'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          JUDGE_MODEL_NAME: qwen-plus
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            LIMIT=5
          fi
          python -m eval.run_agent_eval \
            --limit "$LIMIT" \
            --judge \
            --output eval/nightly_results.jsonl \
            --report eval/nightly_report.md

      - name: Check case and judge errors
        if: steps.key.outputs.present == 'yes'
        run: |
          python - <<'PY'
          import json
          import sys

          rows = [
              json.loads(line)
              for line in open("eval/nightly_results.jsonl", encoding="utf-8")
              if line.strip()
          ]
          case_errors = [row["id"] for row in rows if row.get("error")]
          judge_errors = [row["id"] for row in rows if row.get("judge_error")]
          print("case errors:", case_errors)
          print("judge errors:", judge_errors)
          if case_errors or judge_errors:
              sys.exit(1)
          PY

      - name: Regression check for full run
        if: steps.key.outputs.present == 'yes' && github.event.inputs.limit == '30'
        run: |
          python -m eval.judge \
            --check-regression \
            --baseline eval/baseline_metrics.json \
            --current eval/nightly_results.jsonl

      - name: Skip notice
        if: steps.key.outputs.present != 'yes'
        run: echo "DASHSCOPE_API_KEY 未配置，跳过在线评测；pytest 已通过。"

      - name: Upload eval artifacts
        if: always() && steps.key.outputs.present == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-nightly
          path: |
            eval/nightly_results.jsonl
            eval/nightly_report.md
          if-no-files-found: ignore
